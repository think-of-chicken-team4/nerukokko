[platformio]
default_envs = esp32dev

; すべての環境で共通の設定
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
build_flags =
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; 本番のファームウェア（src/hwtest/ は含めない）
[env:esp32dev]
build_src_filter = +<*> -<hwtest/>

; ---------------------------------------------------------------------------
; 実機検証用のテストプログラム（docs/hw-verification.md）
;   書き込み＋シリアルモニタ：pio run -e <環境名> -t upload -t monitor
; ---------------------------------------------------------------------------

; I2C につながっている機器のアドレスを一覧表示する（E1・配線確認）
[env:hwtest_i2c_scan]
build_src_filter = -<*> +<hwtest/i2c_scan.cpp>

; E1：加速度センサーの確認と寝返りしきい値の調整
[env:hwtest_accel]
build_src_filter = -<*> +<hwtest/accel_test.cpp>

; E2：マイクの音量レベルの測定
[env:hwtest_mic]
build_src_filter = -<*> +<hwtest/mic_test.cpp> +<AudioSensor.cpp>

; E3：充電検知（巣に置いた・取り出した）の確認
;   巣からの 5V を分圧して ADC で読む場合は、例：-D VIN_SENSE_PIN=35 -D VIN_DIVIDER_RATIO=2.0
[env:hwtest_dock]
build_src_filter = -<*> +<hwtest/dock_test.cpp>

; E5：バッテリーの持ち（本番と同じ動作＋稼働時間を1分ごとに内蔵フラッシュへ記録）
[env:hwtest_battery]
build_src_filter = +<*> -<hwtest/> +<hwtest/UptimeLog.cpp>
build_flags =
    ${env.build_flags}
    -D NERUKOKKO_UPTIME_LOG
