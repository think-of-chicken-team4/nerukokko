# main にマージされたら、Supabase（クラウド）にマイグレーションと Edge Functions を反映する（docs/cloud-setup.md §9）。
# Webアプリ（app/）は Vercel が main を見て自動で公開するので、ここでは扱わない。
#
# 必要な設定（GitHub の Settings → Secrets and variables → Actions。田村さんが登録する）：
#   Variables：SUPABASE_PROJECT_ID   … プロジェクトの Reference ID（秘密ではない）
#   Secrets  ：SUPABASE_ACCESS_TOKEN … Supabase のアクセストークン（秘密）
#              SUPABASE_DB_PASSWORD  … データベースのパスワード（秘密）
# SUPABASE_PROJECT_ID が登録されるまでは、ジョブを飛ばす（失敗にはしない）。
# 関数の秘密の値（GEMINI_API_KEY など）と Vault はここでは変えない（手で `npx supabase secrets set` する）。
name: Supabase に公開

on:
  push:
    branches: [main]
    paths:
      - "server/supabase/migrations/**"
      - "server/supabase/functions/**"
      - "server/supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  # Actions の画面の「Run workflow」から手で動かす（まとめて反映し直したいとき）
  workflow_dispatch:

# 2つ同時に反映しない（前の反映が終わるのを待つ）
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: マイグレーションと関数を Supabase に反映
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Supabase CLI は server/package.json の版を使う（手元と同じ版）
      - run: npm ci

      # 壊れたマイグレーションや関数を本番に入れないよう、先にテストする
      - name: DB と関数のテスト
        run: |
          npm run test:db
          npm run test:functions

      - name: 反映するマイグレーションを表示する
        run: npx supabase db push --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --skip-vault --dry-run

      - name: マイグレーションを反映する（まだ入っていないものだけ）
        run: npx supabase db push --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --skip-vault --yes

      - name: Edge Functions を反映する（全部）
        run: npx supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
